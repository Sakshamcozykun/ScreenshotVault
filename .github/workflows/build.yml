name: Build ScreenshotVault

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Windows App SDK workload
      run: dotnet workload install microsoft-windows-sdk-buildtools

    - name: Restore packages
      run: dotnet restore ScreenshotVault.sln

    - name: Build & publish self-contained exe
      run: |
        dotnet publish src/ScreenshotVault.App/ScreenshotVault.App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:Platform=x64 `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenshotVault-exe
        path: ./publish/
        retention-days: 30
