name: Build ScreenshotVault

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish App
      run: >
        dotnet publish src/ScreenshotVault.App/ScreenshotVault.App.csproj 
        -c Release 
        -r win-x64 
        -p:Platform=x64 
        --self-contained true 
        -p:WindowsPackageType=None 
        -p:UseRidGraph=true 
        -o ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenshotVault-exe
        path: ./publish/
        retention-days: 30