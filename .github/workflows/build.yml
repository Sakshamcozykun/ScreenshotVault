name: Build ScreenshotVault

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: ScreenshotVault.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore packages
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release /p:Platform=x64

    - name: Build with MSBuild
      run: |
        msbuild src\ScreenshotVault.App\ScreenshotVault.App.csproj `
          /t:Build `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:WindowsAppSDKSelfContained=true `
          /p:WindowsPackageType=None `
          /p:RuntimeIdentifier=win-x64

    - name: Copy output to publish folder
      run: |
        New-Item -ItemType Directory -Force -Path ./publish
        Copy-Item -Path "src\ScreenshotVault.App\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\*" -Destination ./publish -Recurse

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenshotVault-exe
        path: ./publish/
        retention-days: 30