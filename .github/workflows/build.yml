name: Build ScreenshotVault

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore src/ScreenshotVault.App/ScreenshotVault.App.csproj /p:Platform=x64

    - name: Publish
      run: dotnet publish src/ScreenshotVault.App/ScreenshotVault.App.csproj -c Release /p:Platform=x64 -o ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenshotVault-exe
        path: ./publish/
        retention-days: 30
