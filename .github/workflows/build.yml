name: Build ScreenshotVault

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install windows workload
      run: dotnet workload install windows

    - name: Restore packages
      run: dotnet restore ScreenshotVault.sln /p:Platform=x64

    - name: Build and publish
      run: dotnet publish src/ScreenshotVault.App/ScreenshotVault.App.csproj -c Release -r win-x64 --self-contained true /p:Platform=x64 /p:WindowsAppSDKSelfContained=true /p:WindowsPackageType=None /p:PublishSingleFile=false -o ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenshotVault-exe
        path: ./publish/
        retention-days: 30
